name: Beta release

on:
  push:
    tags: ['v*-beta.*']

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - name: Require immutable releases
        env:
          GH_TOKEN: ${{ secrets.RELEASE_SETTINGS_TOKEN }}
        run: |
          set -euo pipefail
          immutable_enabled="$(
            gh api \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2026-03-10" \
              "repos/$GITHUB_REPOSITORY/immutable-releases" \
              --jq '.enabled'
          )"
          if [[ "$immutable_enabled" != "true" ]]; then
            echo "::error::Immutable releases must be enabled before packaging an alpha."
            exit 1
          fi

  validate:
    needs: preflight
    uses: ./.github/workflows/ci.yml

  build:
    needs: validate
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            # 'app' is required for the .app.tar.gz updater artifact; dmg alone
            # never produces one.
            bundles: dmg,app
            target: universal-apple-darwin
            rustTargets: aarch64-apple-darwin,x86_64-apple-darwin
          - platform: windows-latest
            bundles: nsis
            target: x86_64-pc-windows-msvc
            rustTargets: x86_64-pc-windows-msvc
          - platform: ubuntu-22.04
            bundles: appimage,deb
            target: x86_64-unknown-linux-gnu
            rustTargets: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rustTargets }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Check release tag and version agreement
        shell: bash
        run: node scripts/releaseVersion.mjs "$GITHUB_REF_NAME"

      - name: Build native installer
        uses: tauri-apps/tauri-action@v1
        env:
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && '-' || '' }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # createUpdaterArtifacts makes the bundler always attempt updater
          # signing; an unset secret expands to '', which it reads as an
          # invalid key and hard-fails. --no-sign skips signing outright —
          # except on macOS, where it would also skip the ad-hoc codesign that
          # APPLE_SIGNING_IDENTITY: '-' exists to perform (the bundler patches
          # the binary post-link, invalidating the linker's own signature, and
          # arm64 refuses to run an unsigned Mach-O). Dropping 'app' instead
          # leaves no updater-eligible bundle, so signing no-ops on its own.
          args: >-
            --target ${{ matrix.target }}
            --bundles ${{ matrix.platform == 'macos-latest' && secrets.TAURI_SIGNING_PRIVATE_KEY == '' && 'dmg' || matrix.bundles }}
            ${{ secrets.TAURI_SIGNING_PRIVATE_KEY == '' && matrix.platform != 'macos-latest' && '--no-sign' || '' }}
          uploadWorkflowArtifacts: true
          workflowArtifactNamePattern: '[platform]-[arch]-[bundle]'

      # tauri-action only uploads extensions on its own hardcoded allowlist
      # (.dmg/.exe/.msi/.deb/.AppImage/…), which excludes .sig files and the
      # .app.tar.gz/.nsis.zip updater payloads — without this step the release
      # job never sees a signature and the manifest can never be built.
      - name: Upload updater signatures and payloads
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.platform }}-${{ matrix.target }}-updater
          path: |
            src-tauri/target/**/release/bundle/**/*.sig
            src-tauri/target/**/release/bundle/**/*.app.tar.gz
            src-tauri/target/**/release/bundle/**/*.nsis.zip
          if-no-files-found: ignore

  build-android:
    needs: validate
    permissions:
      contents: read
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.0.12077973"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Check release tag and version agreement
        shell: bash
        run: node scripts/releaseVersion.mjs "$GITHUB_REF_NAME"

      - name: Decode Android signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/heartwood-beta-release.keystore"

      - name: Build Android release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/heartwood-beta-release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: npx tauri android build --target aarch64

      - name: Upload Android release artifact
        uses: actions/upload-artifact@v7
        with:
          name: android-aarch64-apk
          path: src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk
          if-no-files-found: error

  release:
    needs: [build, build-android]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Download native installers
        uses: actions/download-artifact@v8
        with:
          path: release-artifacts
          pattern: '*-*-*'
          merge-multiple: true

      - name: Build the updater manifest
        run: >-
          node scripts/buildUpdaterManifest.mjs release-artifacts "$GITHUB_REF_NAME"
          "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME"

      - name: Publish the updater manifest to main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ ! -f release-artifacts/latest.json ]; then
            echo "No updater manifest was produced (unsigned build) — nothing to publish."
            exit 0
          fi
          gh auth setup-git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git worktree add "$RUNNER_TEMP/main-worktree" origin/main
          mkdir -p "$RUNNER_TEMP/main-worktree/docs/updates"
          cp release-artifacts/latest.json "$RUNNER_TEMP/main-worktree/docs/updates/latest.json"
          cd "$RUNNER_TEMP/main-worktree"
          # Stage first: on the very first release docs/updates/latest.json is
          # untracked, and `git diff` ignores untracked files — an unstaged
          # check would report "unchanged" and never publish it.
          git add docs/updates/latest.json
          if git diff --cached --quiet -- docs/updates/latest.json; then
            echo "Manifest unchanged, nothing to commit."
            exit 0
          fi
          git commit -m "chore: publish updater manifest for $GITHUB_REF_NAME"
          git push origin HEAD:main

      - name: Validate and prepare release assets
        run: node scripts/prepareBetaAssets.mjs release-artifacts release-assets

      - name: Render commit-pinned release notes
        run: |
          sed "s/__RELEASE_COMMIT_SHA__/$GITHUB_SHA/g" \
            docs/beta-release-notes.md > "$RUNNER_TEMP/beta-release-notes.md"
          grep -q "$GITHUB_SHA" "$RUNNER_TEMP/beta-release-notes.md"
          if grep -q '__RELEASE_COMMIT_SHA__' "$RUNNER_TEMP/beta-release-notes.md"; then
            echo "::error::Release notes contain an unresolved commit placeholder."
            exit 1
          fi

      - name: Create GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh auth setup-git
          git fetch --force origin \
            "+refs/heads/main:refs/remotes/origin/main" \
            "+refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          tag_commit="$(git rev-parse "$GITHUB_REF_NAME^{commit}")"
          if [[ "$tag_commit" != "$GITHUB_SHA" ]]; then
            echo "::error::Remote tag $GITHUB_REF_NAME does not point to $GITHUB_SHA."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Release commit $GITHUB_SHA is not contained in origin/main."
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --verify-tag \
            --prerelease \
            --title "Heartwood $GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/beta-release-notes.md"
