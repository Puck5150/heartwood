name: Alpha defect
description: Report a reproducible problem in a private alpha build
title: '[Alpha]: '
labels: [bug]
assignees: []
body:
  - type: markdown
    attributes:
      value: >-
        Remove or redact private note and parked-thought content before
        attaching files. Share only sanitized logs and screenshots.
  - type: input
    id: alpha-version
    attributes:
      label: Alpha version
      description: Enter the exact tag shown on the GitHub prerelease.
      placeholder: v0.1.0-alpha.1
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      description: Select the operating system where the defect occurred.
      options: [macOS, Windows, Linux]
    validations:
      required: true
  - type: input
    id: os-version
    attributes:
      label: Operating system version
      placeholder: macOS 15.6, Windows 11 24H2, or Ubuntu 24.04
    validations:
      required: true
  - type: dropdown
    id: artifact
    attributes:
      label: Installation artifact
      options:
        - macOS universal .dmg
        - Windows x64 NSIS .exe
        - Linux x64 AppImage
        - Linux x64 .deb
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Provide the smallest numbered sequence that reproduces the problem.
      placeholder: |
        1. Start a 1-minute focus session.
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead, including any visible error?
    validations:
      required: true
  - type: textarea
    id: data-impact
    attributes:
      label: Local data impact
      description: >-
        State whether any timer, note, parked thought, preference, revision, or
        other local data was lost or changed. Write "None observed" when applicable.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized logs or screenshots
      description: >-
        Optional. Drag in sanitized files only after removing or redacting all
        private notes, parked thoughts, usernames, and paths that identify you.
    validations:
      required: false
  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Optional details that may help explain the environment or frequency.
    validations:
      required: false
  - type: checkboxes
    id: privacy-check
    attributes:
      label: Privacy check
      options:
        - label: I removed or redacted private content from this report and its attachments.
          required: true
    validations:
      required: true

