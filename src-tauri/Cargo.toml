[package]
name = "app"
version = "0.1.0-beta.14"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.11.3", features = [] }
tauri-plugin-sql = { version = "2.4.0", features = ["sqlite"] }
tauri-plugin-dialog = "2.7.2"
tauri-plugin-fs = "2.5.1"
# Used directly (not just transitively through tauri-plugin-sql) for the two
# deletes in db_commands.rs that need a real sqlx::Transaction — see that
# file's module doc for why. Same feature set tauri-plugin-sql's own
# "sqlite" feature enables, so this unifies with the existing resolution
# instead of pulling in a second sqlx build.
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio"] }
# Pinned to 0.2.3: the 0.3 line moved to Rust 2024 and requires Rust 1.85,
# which is incompatible with this crate's declared Rust 1.77.2 minimum.
atomic-write-file = "=0.2.3"
chrono = { version = "0.4", features = ["clock"] }
sha2 = "0.10"
# Pinned to =1.20.0: 1.21.0 bumped uuid's own MSRV to Rust 1.85, incompatible
# with this crate's declared Rust 1.77.2 minimum (see atomic-write-file above
# for the same reasoning). 1.20.0 is the newest release before that bump.
uuid = { version = "=1.20.0", features = ["v4"] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2.3.3"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# Used on every platform to detect Android at runtime (App.svelte picks the
# Android vs. desktop update-check implementation from it) — desktop-plugin-
# updater's own auto-update path has no Android equivalent, so this is how
# the app knows which one to wire in.
tauri-plugin-os = "2"
# Android's update download needs this: plugin-http's fetch (tried first)
# routes bytes through the JS<->Rust IPC bridge in chunks reassembled by
# response.arrayBuffer() — for a ~140MB APK that bridge itself broke with
# "Invalid array length" partway through, a plugin-http limitation, not a
# CORS or permission issue (both already ruled out). plugin-upload's
# download() streams the response straight to disk on the Rust side and
# never brings the bytes into JS at all, sidestepping that entirely.
tauri-plugin-upload = "2"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tempfile = "3"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2.4.3"

[target.'cfg(target_os = "android")'.dependencies]
# Pinned to a commit, not a floating version: single-maintainer, unproven
# (0 stars/forks, ~2 months old at the time this was added) crate that
# installs arbitrary code onto the device — see the design spike this was
# adopted from. Fills a real gap: tauri-plugin-updater has no Android
# equivalent, and no other maintained crate does this.
tauri-plugin-android-installer = { git = "https://github.com/iMalFect/tauri-plugin-android-installer", rev = "f126f1604c7cbd25961d117f97b7f528e9a79cb4" }
